# From scholeo-ai/site-kit new-site/workflows/deploy.yml. Builds the site and
# deploys it to the Cloudflare Worker scholeo-transformer-explained on each push
# to main, and by hand (Actions → deploy → Run workflow). Works once the repo is
# in scholeo-ai: site-kit is private to that organization.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    uses: scholeo-ai/site-kit/.github/workflows/deploy.yml@main
    with:
      # Notebooks are committed with their outputs, so the build does not run them.
      build-command: python3 -m venv .venv && .venv/bin/pip install -r requirements-docs.txt && .venv/bin/mkdocs build --strict
      check: true
      assets-directory: site
    secrets: inherit
